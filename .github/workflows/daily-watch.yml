name: daily-watch

# Daily, two checks. The watch job: is there a newer WoW Forever build than the one the Journal's data is read from
# (BUILD in Tools/sources/wago.py)? If so, a pull request that moves to it, with the faction data
# rebuilt, a changelog line saying the Journal's data is updated to the build (and what it
# changes), and a report of what the build changes for the Journal (Tools/release/watch_build.py).
# If not, and the data still carries hotfixed rewards over from an older build, whether
# wago.tools has recorded the build's own hotfixes yet: then a pull request that rebuilds
# from them, dropping what Blizzard removed.
# Where the organization does not let workflows open pull requests ("Allow GitHub Actions to
# create and approve pull requests" off), an issue instead, with the report and a link that
# opens the pull request in one click. One issue only: each run updates the open one, to the
# newest build and its report; it is closed once a pull request for the build is open.
# Only the game's own tables are read, through wago.tools. Run workflow does the same on
# demand, for a build of your choice or as a report only.
# With the move, the Naowh Score's constants are refitted to the build's item table
# (Tools/build/fit_naowh_score.py): NaowhForever_BiS/NaowhScore/Data/Formula.lua changes in the same pull request
# when they move enough and pass its quality gates, and the report gets a "Naowh Score"
# section either way (a manual run reports it too). A fit that fails only says so. A refit
# that changes Formula.lua gets its own changelog line: every player's score moves.
# The loot job: whether wowsrc.com's Forever loot pages list something the Journal was not
# built from (Tools/data/wowsrc_loot.json): items a boss gained or lost, new bosses and pages.
# If so, the Journal is rebuilt from them and a pull request says what. The bis job: the
# same for wowsrc's BiS lists and the BiS List's data. Both ask Wowhead nothing (--offline):
# a new item's facts come from the game's own tables, and what those cannot settle is listed
# in the pull request, for a run on our machines (Tools/README.md). wowsrc allows crawling,
# and gave us permission.
# The three run one after another on one branch, each on what the one before changed, and
# whatever they change goes in one pull request, one commit (it is squash merged): a title
# saying what is in it, a short list, and each check's report folded away in its description
# (Tools/hooks/daily-pull-request.sh). The checks' lines for players go under "## Changelog" in
# the description, for the release to copy into CHANGELOG.md; with none, the pull request is
# labelled "no changelog". Each run brings the open one up to date; an issue with a link where
# workflows may not open one. A check that fails leaves out only its own change.
on:
  schedule:
    # New builds and hotfixes come with the US realms' weekly maintenance (Tuesday mornings,
    # Pacific time, usually over by 11:00). 20:00 UTC is 13:00 Pacific in summer and 12:00 in
    # winter: after it, every day of the week. GitHub reads cron in UTC and may start a
    # scheduled run some minutes late.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      build:
        description: "Forever build to check, like 1.60.1.12345 (empty: the newest wago.tools has)"
        required: false
        type: string
      force:
        description: "Report even when it is the build already in use"
        type: boolean
        default: false
      open_pr:
        description: "Open the pull request when there is a change (untick: reports only)"
        type: boolean
        default: true
      allow_losses:
        description: "Move even when the new build lacks rewards the current one has (they were really removed)"
        type: boolean
        default: false

permissions: {}

# One at a time, and never cut short: a run may be pushing its branch.
concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  daily:
    name: daily
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # A scheduled run always opens the pull request; a manual one when asked.
      OPEN_PR: ${{ github.event_name == 'schedule' || inputs.open_pr }}
      PR: bash Tools/hooks/daily-pull-request.sh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Each check's change is committed as it lands, so a check that fails after it can go back
      # to it; the pull request squashes them all from BASE into one.
      - name: Start the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compare with the newest Forever build
        id: watch
        continue-on-error: true
        env:
          BUILD: ${{ inputs.build }}
          FORCE: ${{ inputs.force }}
          ALLOW_LOSSES: ${{ inputs.allow_losses }}
        run: |
          args=(--report "$RUNNER_TEMP/watch.md" --github-output "$GITHUB_OUTPUT")
          if [ -n "$BUILD" ]; then
            if ! [[ "$BUILD" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Build should read like 1.60.1.12345, not '$BUILD'"
              exit 1
            fi
            args+=(--build "$BUILD")
          fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$OPEN_PR" = "true" ]; then args+=(--update); fi
          if [ "$ALLOW_LOSSES" = "true" ]; then args+=(--allow-losses); fi
          python Tools/release/watch_build.py "${args[@]}"
          cat "$RUNNER_TEMP/watch.md" >> "$GITHUB_STEP_SUMMARY"

      # The Naowh Score's constants, refitted to the build moved to: Formula.lua is rewritten
      # only on a move (when they move enough and pass the gates), and a manual run only
      # reports. Its section goes in the build's report, so in the pull request. Never fails.
      - name: Refit the Naowh Score
        if: steps.watch.outcome == 'success' && (steps.watch.outputs.made == 'true' || github.event_name == 'workflow_dispatch')
        env:
          BUILD: ${{ steps.watch.outputs.build }}
          WRITE: ${{ steps.watch.outputs.made }}
        run: |
          args=(--build "$BUILD" --report "$RUNNER_TEMP/score.md")
          if [ "$WRITE" = "true" ]; then args+=(--write); fi
          if ! python Tools/build/fit_naowh_score.py "${args[@]}"; then
            echo "::warning::The Naowh Score refit failed: its constants stay as they are."
            {
              echo "### Naowh Score"
              echo
              echo "> **Not refitted:** the fit failed (see the run log). The constants stay as they are."
            } > "$RUNNER_TEMP/score.md"
          fi
          { echo; cat "$RUNNER_TEMP/score.md"; } >> "$RUNNER_TEMP/watch.md"
          cat "$RUNNER_TEMP/score.md" >> "$GITHUB_STEP_SUMMARY"

      # The script made the change, and says what to call it (a new build, or the build's own
      # hotfixes coming in) and its changelog line, if any. A refitted Naowh Score adds one.
      - name: Add the build
        if: steps.watch.outcome == 'success' && steps.watch.outputs.made == 'true'
        env:
          TITLE: ${{ steps.watch.outputs.title }}
          CHANGELOG: ${{ steps.watch.outputs.changelog }}
        run: |
          nl=$'\n'
          if ! git diff --quiet -- NaowhForever_BiS/NaowhScore/Data/Formula.lua; then
            CHANGELOG="${CHANGELOG:+$CHANGELOG$nl}Changed: Naowh Score: refitted to the latest Forever items."
          fi
          $PR add watch "${TITLE#chore(data): }" "$RUNNER_TEMP/watch.md" "$CHANGELOG" \
            Tools/sources/wago.py NaowhForever_DungeonJournal/Data NaowhForever_BiS/NaowhScore/Data Shared/Data

      - name: Compare wowsrc.com's loot pages with ours
        id: loot
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          git reset -q --hard HEAD && git clean -fdq -- Tools NaowhForever_DungeonJournal NaowhForever_BiS Shared
          python Tools/sources/wowsrc.py --check --report "$RUNNER_TEMP/loot.md" --github-output "$GITHUB_OUTPUT"
          if grep -q "^changes=true" "$GITHUB_OUTPUT"; then
            # The pages the check read (Tools/data/wowsrc_pages), their names to item IDs, the Journal.
            python Tools/sources/wowsrc.py
            python Tools/sources/wowsrc.py --resolve --offline 2> "$RUNNER_TEMP/resolve.txt"
            python Tools/build/journal.py --offline > /dev/null 2> "$RUNNER_TEMP/build.txt"
            {
              echo
              echo "### What the build said"
              echo
              echo '```'
              tail -n 60 "$RUNNER_TEMP/resolve.txt"
              grep -Ev "^ *[0-9]+  " "$RUNNER_TEMP/build.txt" | tail -n 80
              echo '```'
            } >> "$RUNNER_TEMP/loot.md"
          fi
          cat "$RUNNER_TEMP/loot.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Add the boss loot
        if: steps.loot.outcome == 'success' && steps.loot.outputs.changes == 'true'
        run: |
          $PR add loot "boss loot" "$RUNNER_TEMP/loot.md" \
            "Changed: Dungeon Journal: boss loot updated from the latest Forever loot lists." \
            Tools/data/wowsrc_loot.json Tools/data/item_names.json Tools/data/journal_cache.json NaowhForever_DungeonJournal/Data Shared/Data

      - name: Compare wowsrc.com's BiS lists with ours
        id: bis
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          git reset -q --hard HEAD && git clean -fdq -- Tools NaowhForever_DungeonJournal NaowhForever_BiS Shared
          python Tools/build/bis_data.py --check --report "$RUNNER_TEMP/bis.md" --github-output "$GITHUB_OUTPUT"
          if grep -q "^changes=true" "$GITHUB_OUTPUT"; then
            python Tools/build/bis_data.py --offline 2> "$RUNNER_TEMP/bis-build.txt"
            {
              echo
              echo "### What the build said"
              echo
              echo '```'
              tail -n 80 "$RUNNER_TEMP/bis-build.txt"
              echo '```'
            } >> "$RUNNER_TEMP/bis.md"
          fi
          cat "$RUNNER_TEMP/bis.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Add the BiS lists
        if: steps.bis.outcome == 'success' && steps.bis.outputs.changes == 'true'
        run: |
          $PR add bis "BiS lists" "$RUNNER_TEMP/bis.md" \
            "Changed: BiS List: picks updated from wowsrc.com's latest lists." \
            NaowhForever_BiS/BiS/Data/BiS.lua Tools/data/bis_item_ids.json Tools/data/bis_sources.json

      # A new pick CI could not find a source for (it may not read Wowhead) fails the
      # regression test every pull request runs: the pull request stays a draft, saying what
      # to run on our machines, so it is not merged red.
      - name: Check every BiS pick has a source
        if: steps.bis.outcome == 'success' && steps.bis.outputs.changes == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lua5.1
          if lua5.1 Tools/regression/test-bis-dungeon-drops.lua > "$RUNNER_TEMP/sources.txt" 2>&1; then
            echo "Every pick has a source."
            exit 0
          fi
          missing="$(grep -o 'no source: [0-9, ]*' "$RUNNER_TEMP/sources.txt" | head -n 1 | sed 's/^no source: //')"
          {
            echo "Some new BiS picks have no source (CI may not read Wowhead): ${missing:-see the run}."
            echo "On a branch from main, run \`python Tools/build/bis_data.py --sources-only\` and add what"
            echo "Wowhead has no source for either to the known list in"
            echo "\`Tools/regression/test-bis-dungeon-drops.lua\`, in a pull request of its own (as #57"
            echo "did). Once it is merged, the next run rebuilds this one on it and marks it ready."
          } > "$RUNNER_TEMP/hold.md"
          $PR hold "$RUNNER_TEMP/hold.md"

      # A check that failed half way: its files as the last good check left them.
      - name: Leave out what a failed check left
        if: ${{ !cancelled() }}
        run: git reset -q --hard HEAD && git clean -fdq -- Tools NaowhForever_DungeonJournal NaowhForever_BiS Shared

      - name: Open the pull request
        if: ${{ !cancelled() && env.OPEN_PR == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: $PR open daily-data

      # The run says a check failed, after the others' changes went in.
      - name: Fail if a check failed
        if: ${{ !cancelled() && (steps.watch.outcome == 'failure' || steps.loot.outcome == 'failure' || steps.bis.outcome == 'failure') }}
        env:
          WATCH: ${{ steps.watch.outcome }}
          LOOT: ${{ steps.loot.outcome }}
          BIS: ${{ steps.bis.outcome }}
        run: |
          echo "::error::A check failed (watch: $WATCH, loot: $LOOT, bis: $BIS); the others' changes are in the pull request."
          exit 1
