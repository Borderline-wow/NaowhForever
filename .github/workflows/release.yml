name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:

  release:

    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Release
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1682733 -a nGv7jeNx