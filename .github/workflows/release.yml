name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:

  release:

    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Release
        uses: BigWigsMods/packager@v2

      - name: Post changelog to Discord
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: |
          # CHANGELOG.md hard-wraps list items; join them so Discord doesn't break mid-sentence.
          # The repo stores CRLF (.gitattributes -text), and the runner's awk keeps the CR.
          notes=$(awk -v v="## ${GITHUB_REF_NAME}" '
            {sub(/\r$/, "")}
            $0 == v {f = 1; next}
            /^## / {f = 0}
            !f {next}
            /^### / {sub(/^### /, ""); $0 = "**" $0 "**"}
            /^ +[^ -]/ && out != "" {sub(/^ +/, ""); out = out " " $0; next}
            {out = out (out == "" ? "" : "\n") $0}
            END {print out}' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "No '## ${GITHUB_REF_NAME}' section in CHANGELOG.md"
            exit 1
          fi
          jq -n --arg title "Naowh Forever ${GITHUB_REF_NAME}" --arg notes "$notes" \
            '{embeds: [{title: $title, description: $notes[0:4096], color: 10181046}]}' |
            curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"